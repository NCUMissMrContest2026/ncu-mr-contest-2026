<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NCU Mr.Contest 2026</title>

  <style>
    /* =========================
   ページ全体
========================= */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  background: #eef5fa;
  color: #333;
  text-align: center;
}


/* =========================
   ヘッダー
========================= */
header {
  padding: 55px 20px 45px;
  background: rgba(255, 255, 255, 0.92);
  border-bottom: 1px solid #dfe6ec;
}

.event-name {
  margin: 0;
  font-size: 13px;
  letter-spacing: 4px;
  color: #8b969f;
  font-family: sans-serif;
}

h1 {
  margin: 12px 0 0;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 4px;
  color: #333;
}

.subtitle {
  margin: 18px 0 0;
  font-size: 16px;
  letter-spacing: 2px;
  color: #78848e;
}


/* =========================
   候補者一覧
========================= */
#candidates {
  padding: 20px 0 60px;
}


/* =========================
   候補者カード
========================= */
.candidate {
  width: 88%;
  max-width: 400px;
  margin: 30px auto;
  padding: 14px 14px 25px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 5px 25px rgba(70, 100, 120, 0.08);
}


/* =========================
   候補者写真
========================= */
.candidate img {
  width: 100%;
  display: block;
  border-radius: 6px;
}


/* =========================
   候補者名
========================= */
.candidate h2 {
  margin: 8px 0 18px;
  font-size: 25px;
  font-weight: 500;
  letter-spacing: 2px;
  color: #333;
}

.entry-number {
  font-size: 20px;
  letter-spacing: 2px;
  margin: 18px 0 5px;
  color: #333;
}

.reading {
  font-size: 18px;
  letter-spacing: 1px;
  margin: 0 0 0;
  color: #333;
}


/* =========================
   投票ボタン
========================= */
.vote-button {
  border: 1px solid #71879a;
  border-radius: 30px;
  padding: 14px 38px;
  background: #fff;
  color: #6b8ba3;
  font-family: sans-serif;
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: 0.2s;
}

.vote-button:hover {
  background: #526b80;
  color: #fff;
}

.vote-button:disabled {
  background: #edf1f4;
  border-color: #edf1f4;
  color: #8d989f;
  cursor: default;
}


/* =========================
   投票完了メッセージ
========================= */
#voteComplete {
  padding: 30px 20px;
  margin: 25px auto 0;
  width: 88%;
  max-width: 400px;
  background: #fff;
  border: 1px solid #dce5eb;
}

#voteComplete p {
  margin: 0;
  color: #6b8ba3;
  font-size: 16px;
  letter-spacing: 1px;
}


/* =========================
   スマホ用
========================= */
@media (max-width: 480px) {

  header {
    padding: 45px 20px 35px;
  }

  h1 {
    font-size: 25px;
    letter-spacing: 3px;
  }

  .subtitle {
    font-size: 13px;
    letter-spacing: 1.5px;
  }

  .candidate {
    width: 90%;
  }
}
  </style>
</head>


<body>


  <!-- 投票完了メッセージ -->
  <div id="voteComplete" style="display: none;">
    <p>投票ありがとうございました♡</p>
  </div>


  <!-- ページ上部 -->
  <header>

    

    <h1>
      NCU Mr.Contest 2026
    </h1>

    <p class="subtitle">
      あなたの一票で未来が変わる。
    </p>

  </header>


  <!-- 候補者一覧 -->
  <main id="candidates">
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL = "https://kyatjomzupddnmbmyjvu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J7t9c_3CtqXmpGv3nmJKfQ_g8MocwYp";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    async function loadCandidates() {

      const { data, error } = await supabaseClient
        .from("mr_candidates")
        .select("id, name, image_url, reading")
        .order("id");

      if (error) {
        console.error("候補者取得エラー:", error);
        alert("エラー内容：" + error.message);
        return;
      }

      console.log("候補者データ:", data);

      const candidatesArea =
        document.getElementById("candidates");

      data.forEach(candidate => {

        const card = document.createElement("div");

        card.className = "candidate";

        card.innerHTML = `
          <img
            src="${candidate.image_url}"
            alt="${candidate.name}"
          >

          <p class="entry-number">ENTRY No. ${String(candidate.id).padStart(2, "0")}</p>

<p class="reading">${candidate.reading}</p>
<h2>${candidate.name}</h2>

          <button
            class="vote-button"
            onclick="confirmVote(${candidate.id}, '${candidate.name}')"
          >
            この候補者に投票
          </button>
        `;

        candidatesArea.appendChild(card);
      });
    }


    function confirmVote(candidateId, candidateName) {

      const result = confirm(
       ` ${candidateName}さんに投票しますか？`
      );

      if (result) {
        vote(candidateId);
      }
    }


    async function vote(candidateId) {

      // このブラウザ専用のIDを取得
      let voterId = localStorage.getItem("voter_id");

      if (!voterId) {
        voterId =
          Math.random().toString(36).substring(2)
          + Date.now().toString(36);

        localStorage.setItem("voter_id", voterId);
      }


      // 今日の日付
      const now = new Date();
const today =
  now.getFullYear() + "-" +
  String(now.getMonth() + 1).padStart(2, "0") + "-" +
  String(now.getDate()).padStart(2, "0");

      // ネット投票の締切
const deadline = new Date("2026-11-07T00:00:00+09:00");

if (now >= deadline) {
  alert("ネット投票は終了しました。");
  return;
}

      // 投票を保存
      const { error: insertError } =
        await supabaseClient
          .from("mr_votes")
          .insert({
            candidate_id: candidateId,
            vote_date: today,
            voter_id: voterId
          });


      if (insertError) {

        console.error("投票エラー:", insertError);

        if (insertError.code === "23505") {

          alert(
            "本日の投票はすでに完了しています。"
          );

          return;
        }

        alert(
          "投票に失敗しました："
          + insertError.message
        );

        return;
      }


      // 投票完了メッセージを表示
      const completeMessage =
        document.getElementById("voteComplete");

      if (completeMessage) {
        completeMessage.style.display = "block";
      }


      // すべての投票ボタンを無効にする
      const voteButtons =
        document.querySelectorAll(".vote-button");

      voteButtons.forEach(button => {

        button.disabled = true;

        button.textContent =
          "本日の投票は終了しました";

      });

    }

   function checkDeadline() {
  const now = new Date();
  const deadline = new Date("2026-11-07T00:00:00+09:00");

  if (now >= deadline) {
    const voteButtons =
      document.querySelectorAll(".vote-button");

    voteButtons.forEach(button => {
      button.disabled = true;
      button.textContent = "ネット投票は終了しました";
    });
  }
}

    loadCandidates();
    checkDeadline();

  </script>

</body>

</html>
